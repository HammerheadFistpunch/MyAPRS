name: Build MyAPRS installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64 app
        run: dotnet publish APRSScraper.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Compile single-EXE installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler MyAPRS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify install, service restart, and uninstall
        shell: pwsh
        run: |
          $setup = Start-Process .\dist\MyAPRS-Setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CALLSIGN=N0CALL-9' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)" }
          $service = Get-Service MyAPRS
          $service.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $oldPid = (Get-CimInstance Win32_Service -Filter "Name='MyAPRS'").ProcessId
          if ($oldPid -le 0) { throw 'Logger process was not started' }
          $status = Join-Path $env:ProgramData 'MyAPRS\data\status.json'
          $heartbeatDeadline = (Get-Date).AddSeconds(15)
          while (!(Test-Path $status) -and (Get-Date) -lt $heartbeatDeadline) { Start-Sleep -Seconds 1 }
          if (!(Test-Path $status)) { throw 'Logger did not publish status' }
          Stop-Process -Id $oldPid -Force
          $deadline = (Get-Date).AddSeconds(35)
          do {
            Start-Sleep -Seconds 1
            $restarted = Get-CimInstance Win32_Service -Filter "Name='MyAPRS'"
          } until (($restarted.State -eq 'Running' -and $restarted.ProcessId -ne $oldPid) -or (Get-Date) -gt $deadline)
          if ($restarted.State -ne 'Running' -or $restarted.ProcessId -eq $oldPid) { throw 'Logger did not restart' }
          $archive = Join-Path $env:ProgramData 'MyAPRS\data\N0CALL-9.csv'
          Set-Content $archive 'time,lasttime,lat,lng,speed,course,altitude,comment'
          $uninstall = Start-Process "$env:ProgramFiles\MyAPRS\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Get-Service MyAPRS -ErrorAction SilentlyContinue) { throw 'Uninstall left the service registered' }
          if (!(Test-Path $archive)) { throw 'Uninstall removed the archive' }
      - uses: actions/upload-artifact@v4
        with:
          name: MyAPRS-Setup
          path: dist/MyAPRS-Setup.exe
          if-no-files-found: error
